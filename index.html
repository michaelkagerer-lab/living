<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organism Simulation v1.0</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 38%, #ffffff 0%, #ebebeb 100%);
    }

    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      display: block;
    }

    .card {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 44px 68px 40px;
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 28px;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.025),
        0 4px 8px rgba(0, 0, 0, 0.04),
        0 20px 56px rgba(0, 0, 0, 0.08),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.85);
      text-align: center;
      pointer-events: none;
      user-select: none;
      z-index: 10;
      animation: fadeUp 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translate(-50%, calc(-50% + 20px));
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%);
      }
    }

    .card-dots {
      display: flex;
      justify-content: center;
      gap: 9px;
      margin-bottom: 24px;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      animation: dotPulse 3.2s ease-in-out infinite;
    }

    .dot--blue  { background: #4285F4; animation-delay: 0s; }
    .dot--red   { background: #EA4335; animation-delay: 0.8s; }
    .dot--amber { background: #FBBC04; animation-delay: 1.6s; }
    .dot--green { background: #34A853; animation-delay: 2.4s; }

    @keyframes dotPulse {
      0%, 100% { transform: scale(1);    opacity: 1; }
      50%       { transform: scale(1.45); opacity: 0.55; }
    }

    .card-title {
      font-family: -apple-system, 'Segoe UI', system-ui, Helvetica, sans-serif;
      font-size: 22px;
      font-weight: 500;
      color: rgba(28, 30, 33, 0.88);
      letter-spacing: -0.35px;
      line-height: 1.25;
      margin-bottom: 11px;
    }

    .card-sub {
      font-family: -apple-system, 'Segoe UI', system-ui, Helvetica, sans-serif;
      font-size: 11.5px;
      font-weight: 400;
      color: rgba(90, 95, 100, 0.75);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .card-divider {
      width: 32px;
      height: 1px;
      background: rgba(0, 0, 0, 0.08);
      margin: 18px auto 14px;
    }

    .card-hint {
      font-family: -apple-system, 'Segoe UI', system-ui, Helvetica, sans-serif;
      font-size: 11px;
      color: rgba(100, 105, 110, 0.55);
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="card">
    <div class="card-dots">
      <span class="dot dot--blue"></span>
      <span class="dot dot--red"></span>
      <span class="dot dot--amber"></span>
      <span class="dot dot--green"></span>
    </div>
    <h1 class="card-title">Organism Simulation</h1>
    <p class="card-sub">v 1.0 &nbsp;&bull;&nbsp; Particle Field</p>
    <div class="card-divider"></div>
    <p class="card-hint">Move your cursor through the field</p>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
